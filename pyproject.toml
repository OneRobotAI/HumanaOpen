[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot-robot-humanalite"
version = "0.1.0"
description = "HumanaLite — open-source semi-humanoid robot for LeRobot"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "pyzmq",
]

[project.entry-points."lerobot.robots"]
humanalite = "lerobot_robot_humanalite:HumanaLite"
humanalite_client = "lerobot_robot_humanalite:HumanaLiteClientConfig"
