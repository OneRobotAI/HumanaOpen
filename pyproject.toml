[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "lerobot-robot-openarmsx"
version = "0.1.0"
description = "OpenArmsX — open-source semi-humanoid robot for LeRobot"
requires-python = ">=3.10"
dependencies = [
    "lerobot[feetech]>=1.0",
    "numpy",
    "pyzmq",
]

[project.entry-points."lerobot.robots"]
openarmsx = "lerobot_robot_openarmsx:OpenArmsX"
openarmsx_client = "lerobot_robot_openarmsx:OpenArmsXClientConfig"
