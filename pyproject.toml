[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["lerobot_robot_humanaopen"]

[project]
name = "lerobot-robot-humanaopen"
version = "0.1.0"
description = "HumanaOpen — open-source semi-humanoid robot for LeRobot"
requires-python = ">=3.10"
dependencies = []
[project.entry-points."lerobot.robots"]
humanaopen = "lerobot_robot_humanaopen:HumanaOpen"
humanaopen_client = "lerobot_robot_humanaopen:HumanaOpenClientConfig"
